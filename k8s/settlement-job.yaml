---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: settlement-job
  namespace: fintech
  labels:
    app: settlement-job
    app.kubernetes.io/name: settlement-job
    app.kubernetes.io/part-of: fintech
spec:
  schedule: "0 2 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: settlement-job
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          restartPolicy: OnFailure
          containers:
          - name: settlement-job
            image: ghcr.io/company/go-fintech/settlement-job:latest
            env:
            - name: APP_NAME
              value: "settlement-job"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BROKERS
            - name: DATABASE_HOST
              value: "postgres"
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: POSTGRES_DB
            resources:
              requests:
                memory: "256Mi"
                cpu: "200m"
              limits:
                memory: "512Mi"
                cpu: "1000m"
