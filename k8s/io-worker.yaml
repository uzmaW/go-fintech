---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: io-worker
  namespace: fintech
  labels:
    app: io-worker
    app.kubernetes.io/name: io-worker
    app.kubernetes.io/part-of: fintech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: io-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: io-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: io-worker
        image: ghcr.io/company/go-fintech/io-worker:latest
        command: ["python", "-m", "io_worker"]
        env:
        - name: APP_NAME
          value: "io-worker"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: io-worker
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: io-worker
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: io-worker
  namespace: fintech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: io-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
