---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-processor
  namespace: fintech
  labels:
    app: ledger-processor
    app.kubernetes.io/name: ledger-processor
    app.kubernetes.io/part-of: fintech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-processor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ledger-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: ledger-processor
        image: ghcr.io/company/go-fintech/ledger-processor:latest
        ports:
        - name: http
          containerPort: 8084
        env:
        - name: APP_NAME
          value: "ledger-processor"
        - name: APP_PORT
          value: "8084"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: KAFKA_BROKERS
        - name: KAFKA_CONSUMER_GROUP
          value: "ledger-processor"
        - name: KAFKA_TOPIC_TRANSACTIONS_SETTLED
          value: "transactions.settled"
        - name: DATABASE_HOST
          value: "postgres"
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ledger-processor
  namespace: fintech
  labels:
    app: ledger-processor
spec:
  type: ClusterIP
  selector:
    app: ledger-processor
  ports:
  - name: http
    port: 8084
    targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ledger-processor
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ledger-processor
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledger-processor
  namespace: fintech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledger-processor
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
