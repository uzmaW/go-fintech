---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: fintech
  labels:
    app: kafka-consumer
    app.kubernetes.io/name: kafka-consumer
    app.kubernetes.io/part-of: fintech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kafka-consumer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
      - name: kafka-consumer
        image: ghcr.io/company/go-fintech/kafka-consumer:latest
        command: ["python", "-m", "kafka_consumer"]
        env:
        - name: APP_NAME
          value: "kafka-consumer"
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: kafka-config
              key: KAFKA_BROKERS
        - name: KAFKA_TOPIC
          value: "transactions"
        - name: KAFKA_GROUP_ID
          value: "fintech-processor"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-consumer
  namespace: fintech
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kafka-consumer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kafka-consumer
  namespace: fintech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-consumer
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
