name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/go-fintech

jobs:
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.11"
        cache-dependency-path: go.sum
    - name: Download modules
      run: go mod download
    - name: go vet
      run: go vet ./...
    - name: staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"
    - name: golangci-lint
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.12.2
        golangci-lint run ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.11"
        cache-dependency-path: go.sum
    - name: Download modules
      run: go mod download
    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25.11"
        cache-dependency-path: go.sum
    - name: Download modules
      run: go mod download
    - name: govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: pip install pytest pytest-asyncio
    - name: Run Python tests
      run: cd python/workers && python -m pytest -v

  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [test, test-python, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - api-gateway
          - fraud-service
          - authorization-service
          - ledger-processor
          - notification-service
          - settlement-job
          - cpu-worker
          - io-worker
          - kafka-consumer
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=semver,pattern={{version}}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ (matrix.service == 'cpu-worker' || matrix.service == 'io-worker' || matrix.service == 'kafka-consumer') && './Dockerfile.python' || './Dockerfile' }}
        build-args: SERVICE=${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  update-manifests:
    name: Update K8s Manifests
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Update image tags in k8s manifests
      run: |
        SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
        IMAGE_TAG="${{ github.ref_name }}-${SHORT_SHA}"
        REGISTRY="${{ env.REGISTRY }}/${{ github.repository_owner }}/go-fintech"
        
        for service in api-gateway fraud-service authorization-service ledger-processor notification-service settlement-job cpu-worker io-worker kafka-consumer; do
          sed -i "s|image: ${REGISTRY}/${service}:latest|image: ${REGISTRY}/${service}:${IMAGE_TAG}|g" k8s/${service}.yaml 2>/dev/null || true
        done

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/
        git diff --staged --quiet || git commit -m "chore: update image tags to ${{ github.ref_name }}-${{ github.sha }}"
        git push
